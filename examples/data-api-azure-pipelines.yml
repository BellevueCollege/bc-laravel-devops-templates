# ============================================================
# EXAMPLE: azure-pipelines.yml for the Data API (no front-end build)
# Copy to data-api repo root — see README data-api section for tokens.
# ============================================================

trigger:
  branches:
    include:
      - trunk
  tags:
    include:
      - 'v*'
  paths:
    exclude:
      - azure-pipelines.yml
      - azure-pipelines-release.yml

pr:
  drafts: false
  branches:
    include:
      - '*'

resources:
  repositories:
    - repository: templates
      type: github
      name: BellevueCollege/bc-laravel-devops-templates
      endpoint: github-service-connection
      ref: refs/heads/trunk

extends:
  template: templates/ci/laravel-ci.yml@templates
  parameters:
    appName: 'data-api'

    runTests: true
    # Copy testSetupSteps and testSteps from data-api/azure-pipelines.yml (Sail + PHPUnit).

    phpVersion: '8.3'
    runNpm: false
    cacheRoutes: false

    serverAppRoot: '/var/www/nonpub/data-api'
    serverPublicRoot: '/var/www/html/data-api'
    serverTempRoot: '/var/www/nonpub/TEMP'
    serverBackupPath: '/var/www/nonpub/backups/data-api'

    testEnvironments:
      - name: ApacheTestC
        displayName: 'Apache: Test'
        environment: ApacheTest-C
        variableGroup: 'Data API Test'
