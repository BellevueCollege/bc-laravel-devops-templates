# ============================================================
# EXAMPLE: azure-pipelines-release.yml for a Laravel application
# Copy to your app repo root and fill in the values below.
# ============================================================

trigger: none
pr: none

resources:
  repositories:
    - repository: templates
      type: github
      name: BellevueCollege/bc-laravel-devops-templates
      endpoint: github-service-connection
      ref: refs/heads/trunk

  pipelines:
    - pipeline: ci
      source: 'REPLACE — exact CI pipeline name in Azure DevOps'
      trigger:
        branches:
          include:
            - 'refs/tags/v*'

extends:
  template: templates/release/laravel-release.yml@templates
  parameters:
    appName: 'my-laravel-app'
    githubRepo: 'my-laravel-app'

    serverAppRoot: '/var/www/nonpub/my-laravel-app'
    serverPublicRoot: '/var/www/html/my-laravel-app'
    serverTempRoot: '/var/www/nonpub/TEMP'
    serverBackupPath: '/var/www/nonpub/backups/my-laravel-app'

    productionEnvironments:
      - name: ApacheProdC
        displayName: 'Apache: Production'
        environment: ApacheProd-C
        variableGroup: 'REPLACE — Library group name'
