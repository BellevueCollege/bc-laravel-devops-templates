# ============================================================
# templates/steps/publish-laravel-artifact.yml
# Stages deploy files, creates tar.gz, publishes pipeline artifact.
# Filled .env is excluded; .env.azuredevops remains in the archive.
# ============================================================

parameters:
  - name: appName
    type: string

steps:

  # CopyFiles@2 ** omits dotfiles and is easy to misconfigure; rsync stages the full tree reliably.
  - script: |
      set -euo pipefail

      SOURCE="$(Build.SourcesDirectory)"
      STAGE="$(Build.ArtifactStagingDirectory)/stage"

      rm -rf "$STAGE"
      mkdir -p "$STAGE"

      rsync -a \
        --exclude '.git/' \
        --exclude 'node_modules/' \
        --exclude '.env' \
        --exclude 'bootstrap/cache/*.php' \
        --exclude 'azure-pipelines.yml' \
        --exclude 'azure-pipelines-release.yml' \
        "${SOURCE}/" "${STAGE}/"

      echo "Staged application tree under ${STAGE}"
    displayName: 'Stage Application Files'

  - script: |
      set -euo pipefail

      STAGE="$(Build.ArtifactStagingDirectory)/stage"

      for REQUIRED_PATH in \
        artisan \
        vendor/autoload.php \
        .env.azuredevops \
        public/index.php \
        public/index.php.azuredevops
      do
        if [ ! -e "${STAGE}/${REQUIRED_PATH}" ]; then
          echo "ERROR: Missing required deploy file: ${REQUIRED_PATH}"
          ls -la "$STAGE" || true
          exit 1
        fi
      done

      echo "Deploy archive prerequisites present in stage"
    displayName: 'Verify staged deploy files'

  - script: |
      set -e
      ARCHIVE_NAME="${{ parameters.appName }}_$(Build.BuildId).tar.gz"
      OUT_DIR="$(Build.ArtifactStagingDirectory)/${{ parameters.appName }}"
      mkdir -p "$OUT_DIR"
      tar -czf "$OUT_DIR/$ARCHIVE_NAME" -C "$(Build.ArtifactStagingDirectory)/stage" .
      echo "Created $ARCHIVE_NAME"
      ls -la "$OUT_DIR"
    displayName: 'Create Deployment Archive'

  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)/${{ parameters.appName }}'
      artifact: '${{ parameters.appName }}'
      publishLocation: 'pipeline'
    displayName: 'Publish Artifact'
