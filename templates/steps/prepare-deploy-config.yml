# ============================================================
# templates/steps/prepare-deploy-config.yml
# Extracts token templates from the build archive, replaces tokens
# in Agent.TempDirectory only (never published).
# Runs on Linux VM deployment agents.
# ============================================================

parameters:
  - name: appName
    type: string
  - name: artifactFolder
    type: string

steps:

  - script: |
      set -Eeuo pipefail

      ARTIFACT_FOLDER="${{ parameters.artifactFolder }}"
      APP_NAME="${{ parameters.appName }}"
      CONFIG_ROOT="${AGENT_TEMPDIRECTORY}/laravel-deploy-config"
      EXTRACT_ROOT="${AGENT_TEMPDIRECTORY}/laravel-deploy-extract"

      rm -rf "$CONFIG_ROOT" "$EXTRACT_ROOT"
      mkdir -p "$CONFIG_ROOT/public" "$EXTRACT_ROOT"

      ARCHIVE_PATH="$(find "$ARTIFACT_FOLDER" -maxdepth 1 -type f -name "${APP_NAME}_*.tar.gz" | head -1)"
      if [ -z "$ARCHIVE_PATH" ]; then
        echo "ERROR: No archive matching ${APP_NAME}_*.tar.gz in ${ARTIFACT_FOLDER}"
        ls -la "$ARTIFACT_FOLDER" || true
        exit 1
      fi

      echo "Using archive: ${ARCHIVE_PATH}"

      ENV_MEMBER="$(tar -tzf "$ARCHIVE_PATH" | grep -E '(^|/)\.env\.azuredevops$' | head -1 || true)"
      INDEX_MEMBER="$(tar -tzf "$ARCHIVE_PATH" | grep -E 'index\.php\.azuredevops$' | head -1 || true)"

      if [ -z "$ENV_MEMBER" ] || [ -z "$INDEX_MEMBER" ]; then
        echo "ERROR: Deploy config templates missing from archive. Listing archive:"
        tar -tzf "$ARCHIVE_PATH" | grep -E 'azuredevops|index\.php' || tar -tzf "$ARCHIVE_PATH" | head -50
        exit 1
      fi

      tar -xzf "$ARCHIVE_PATH" -C "$EXTRACT_ROOT" "$ENV_MEMBER" "$INDEX_MEMBER"

      ENV_SOURCE="$(find "$EXTRACT_ROOT" -name '.env.azuredevops' -type f | head -1)"
      INDEX_SOURCE="$(find "$EXTRACT_ROOT" -name 'index.php.azuredevops' -type f | head -1)"

      if [ -z "$ENV_SOURCE" ] || [ -z "$INDEX_SOURCE" ]; then
        echo "ERROR: Extracted deploy config templates not found under ${EXTRACT_ROOT}"
        find "$EXTRACT_ROOT" -maxdepth 3 -type f || true
        exit 1
      fi

      cp "$ENV_SOURCE" "${CONFIG_ROOT}/.env"
      cp "$INDEX_SOURCE" "${CONFIG_ROOT}/public/index.php"

      echo "##vso[task.setvariable variable=laravelDeployConfigDir]${CONFIG_ROOT}"
      echo "##vso[task.setvariable variable=laravelDeployArchivePath]${ARCHIVE_PATH}"
    displayName: 'Extract config templates from archive'

  - task: replacetokens@6
    inputs:
      rootDirectory: '$(laravelDeployConfigDir)'
      sources: |
        .env
        public/index.php
      tokenPattern: 'custom'
      tokenPrefix: '#{'
      tokenSuffix: '}#'
      addBOM: false
    displayName: 'Replace tokens in deploy config'

  - script: |
      set -Eeuo pipefail

      CONFIG_ROOT="$(laravelDeployConfigDir)"
      LEFTOVER_TOKENS=""

      for CONFIG_FILE in "${CONFIG_ROOT}/.env" "${CONFIG_ROOT}/public/index.php"; do
        while IFS= read -r TOKEN_NAME; do
          if [ -n "$TOKEN_NAME" ]; then
            LEFTOVER_TOKENS="${LEFTOVER_TOKENS}${TOKEN_NAME}"$'\n'
          fi
        done < <(grep -oE '#\{[^}]+\}#' "$CONFIG_FILE" | sed -E 's/^#\{//; s/\}#$//' || true)
      done

      if [ -n "$LEFTOVER_TOKENS" ]; then
        UNIQUE_TOKENS="$(printf '%s' "$LEFTOVER_TOKENS" | sort -u | paste -sd ', ' -)"
        echo "ERROR: Replace Tokens left placeholders: ${UNIQUE_TOKENS}"
        exit 1
      fi

      echo "Deploy config token check passed."
    displayName: 'Verify no leftover tokens'
